# Load this into the existing host Nginx only after a trusted certificate for
# dev.hanlin.ai has been provisioned at the paths below.
server {
    listen 80;
    server_name dev.hanlin.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.hanlin.ai;

    ssl_certificate     /Users/techwu/Documents/codes/hanlin.llm/hanlin.ai/https/certs/dev.hanlin.ai.pem;
    ssl_certificate_key /Users/techwu/Documents/codes/hanlin.llm/hanlin.ai/https/certs/dev.hanlin.ai-key.pem;
    client_max_body_size 50m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:13102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
