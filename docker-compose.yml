# ============================================================================
# DofeAI - Docker Compose
# Local development & production-like environment
# ============================================================================
# Usage:
#   Start all services:    docker compose up -d
#   Start infra only:      docker compose up -d postgres redis rabbitmq
#   Rebuild after changes: docker compose up -d --build
#   View logs:             docker compose logs -f api
#   Stop all:              docker compose down
#   Reset with data:       docker compose down -v
# ============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-healthy: &healthy
  interval: 10s
  timeout: 5s
  retries: 5

services:
  # ---- Infrastructure ----

  postgres:
    image: postgres:16-alpine
    container_name: dofai-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: dofe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dofe_dev_2024}
      POSTGRES_DB: ai_client
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthy
      test: ["CMD-SHELL", "pg_isready -U dofe -d ai_client"]
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: dofai-redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --requirepass ${REDIS_PASSWORD:-dofe_dev_2024}
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      <<: *healthy
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dofe_dev_2024}", "ping"]
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: dofai-rabbitmq
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: dofe
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dofe_dev_2024}
      RABBITMQ_DEFAULT_VHOST: nestjs_xica
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-25672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # ---- Application Services ----

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dofai-api
    restart: unless-stopped
    init: true
    logging: *logging
    ports:
      - "127.0.0.1:${API_PORT:-13102}:13100"
    environment:
      NODE_ENV: dev
      BASE_HOST: postgres
      DATABASE_URL: postgresql://dofe:${POSTGRES_PASSWORD:-dofe_dev_2024}@postgres:5432/ai_client?schema=public&timezone=Asia/Shanghai
      READ_DATABASE_URL: postgresql://dofe:${POSTGRES_PASSWORD:-dofe_dev_2024}@postgres:5432/ai_client?schema=public&timezone=Asia/Shanghai
      REDIS_URL: redis://:${REDIS_PASSWORD:-dofe_dev_2024}@redis:6379/2
      RABBITMQ_URL: amqp://dofe:${RABBITMQ_PASSWORD:-dofe_dev_2024}@rabbitmq:5672/nestjs_xica
      NOVEL_RUNTIME_BASE_URL: http://novel-runtime:18080
      NOVEL_RUNTIME_SHARED_SECRET: ${NOVEL_RUNTIME_SHARED_SECRET:-hanlin_runtime_dev_only}
      SSO_API_URL: ${SSO_API_URL:-https://sso.dofe.ai}
      SSO_INTERNAL_API_URL: ${SSO_INTERNAL_API_URL:-https://sso.dofe.ai}
      SSO_ISSUER: ${SSO_ISSUER:-https://sso.dofe.ai}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-hanlin-ai}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-local-dev-placeholder}
      SSO_SERVICE_NAME: ${SSO_SERVICE_NAME:-hanlin.ai}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-dev-placeholder}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-before-production}
      CRYPTO_KEY: ${CRYPTO_KEY:-local-dev-crypto-key-change-before-production}
      CRYPTO_IV: ${CRYPTO_IV:-local-dev-crypto-iv}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-dev-encryption-key-change-before-production}
    volumes:
      - ./apps/api/config.local.yaml:/app/config.local.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      novel-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend
      - frontend

  novel-runtime:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hanlin-novel-runtime
    restart: unless-stopped
    init: true
    logging: *logging
    environment:
      NOVEL_RUNTIME_SHARED_SECRET: ${NOVEL_RUNTIME_SHARED_SECRET:-hanlin_runtime_dev_only}
      PROJECT_STORAGE_ROOT: /data/projects
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_INTERFACE_FORMAT: ${LLM_INTERFACE_FORMAT:-OpenAI}
    volumes:
      - novel_runtime_data:/data/projects
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_BASE_URL: https://${PUBLIC_DOMAIN:-dev.hanlin.ai}/api
    container_name: dofai-web
    restart: unless-stopped
    init: true
    logging: *logging
    ports:
      - "127.0.0.1:${WEB_PORT:-3004}:3000"
    environment:
      NEXT_PUBLIC_SERVER_BASE_URL: https://${PUBLIC_DOMAIN:-dev.hanlin.ai}/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  novel_runtime_data:
